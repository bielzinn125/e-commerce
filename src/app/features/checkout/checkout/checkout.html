<h2>Checkout</h2>
<form [formGroup]="formulario">
    <p><input type="text" formControlName="nome" placeholder=" Digite seu nome completo"></p>

    @if(formulario.get('nome')?.touched && formulario.get('nome')?.errors?.['required']){
        <small style="color: red;">NOME É OBRIGATÓRIO</small>
    }
    @if(formulario.get('nome')?.errors?.['minlength']){
        <small style="color: red;">NOME DEVE TER NO MÍNIMO (2) DUAS LETRAS</small>
    }
    @if(formulario.get('nome')?.errors?.['numeroInvalido']){
        <small style="color: red;">NOME NAO PODE CONTER NÚMEROS</small>
    }



    <p><input type="email" formControlName="email" placeholder=" Digite seu Email"></p>
    <p><input type="text" formControlName="endereco" placeholder=" Digite seu Endereço"></p>
    <button type="button" (click)="finalizar()">Efetuar Compra</button>
</form>
